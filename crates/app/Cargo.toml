[package]
name = "mezdu-app"
version.workspace = true
edition.workspace = true

[lib]
name = "mezdu"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mezdu"
path = "src/main.rs"

[dependencies]
mezdu-core.workspace = true
mezdu-gfx.workspace = true
winit.workspace = true
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

