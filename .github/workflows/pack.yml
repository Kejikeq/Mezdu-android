# Content pack from the game repo Kejikeq/- (private): needs secret GAME_REPO_TOKEN (fine-grained, read-only Contents on Kejikeq/-).
# Runs every 5 min (the shortest GitHub schedule); rebuilds only when main of Kejikeq/- has a new commit. Published as release "pack":
# every pack file is an asset named path with '/' -> '__' (see mezdu_core::asset_name), plus manifest.json.
name: pack
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: token check
        env:
          T: ${{ secrets.GAME_REPO_TOKEN || secrets.MEZDU }}
        run: '[ -n "$T" ] || { echo "::error::add secret GAME_REPO_TOKEN (or MEZDU: a token with read access to Kejikeq/-)"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kejikeq/-
          ref: main
          token: ${{ secrets.GAME_REPO_TOKEN || secrets.MEZDU }}
          path: game
      - name: up to date?
        id: cmp
        run: |
          new=$(git -C game rev-parse HEAD)
          old=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "https://github.com/${{ github.repository }}/releases/download/pack/manifest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' 2>/dev/null || true)
          echo "game $new, pack $old"
          if [ "$new" = "$old" ] && [ "${{ github.event_name }}" = schedule ]; then echo skip=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.cmp.outputs.skip != '1'
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cmp.outputs.skip != '1'
      - uses: Swatinem/rust-cache@v2
        if: steps.cmp.outputs.skip != '1'
      - name: export + validate
        if: steps.cmp.outputs.skip != '1'
        run: |
          node game/tools/export-native.mjs "$PWD/pack"
          cargo run --release -p mezdu-core --bin packcheck -- pack
          python3 tools/bundle_pack.py pack app/src/main/assets/pack
          mkdir flat && (cd pack && find . -type f | sed 's|^\./||' | while read f; do cp "$f" "../flat/${f//\//__}"; done)
      - name: commit bundled pack to main
        if: steps.cmp.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pack
          if git diff --cached --quiet; then echo "bundled pack unchanged"; exit 0; fi
          git commit -m "build: bundled pack $(git -C game rev-parse --short HEAD)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
      - name: publish release "pack" (data files first, manifest.json last)
        if: steps.cmp.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pack >/dev/null 2>&1 || gh release create pack --title "Контент-пак (последний)" --notes "Собирается из main Kejikeq/-" --latest=false
          # a phone reading manifest.json must find every file it names: the manifest goes up only after them
          ls flat | grep -v '^manifest.json$' | sed 's|^|flat/|' | xargs -n 40 gh release upload pack --clobber
          gh release upload pack flat/manifest.json --clobber
