# 1) builds libmezdu.so (arm64-v8a + x86_64) from crates/ and commits it to app/src/main/jniLibs on main,
#    so Gradle builds without Rust (AI Studio syncs main and packs the current engine);
# 2) builds the APK with Gradle and publishes it as release "app", with the game library of each ABI
#    (libmezdu-<abi>.so.zst + code-<abi>.json): installed APKs download it instead of a new APK.
name: android
on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'app/**', 'gradle/**', '*.gradle.kts', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pinned: a newer clippy brings new lints that would fail -D warnings on unchanged code
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: clippy (desktop + android)
        # android through cargo-ndk: ring (TLS of the updater) compiles C with the NDK's clang
        run: |
          sudo apt-get install -y -q libxkbcommon-dev >/dev/null
          cargo clippy --release -- -D warnings
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -P 26 clippy --release -p mezdu-app -- -D warnings
      - name: native libs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MEZDU_BUILD="${GITHUB_SHA::7}" # the APK compares it with apk-version.txt of the release
          cargo ndk -t arm64-v8a -t x86_64 -P 26 -o app/src/main/jniLibs build --release -p mezdu-app --lib
          # the launcher (entry of the APK) starts the downloaded libmezdu.so or the bundled one
          cargo ndk -t arm64-v8a -t x86_64 -P 26 -o app/src/main/jniLibs build --release -p mezdu-launcher --lib
          ls -la app/src/main/jniLibs/*
      - name: commit native libs to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs
          if git diff --cached --quiet; then echo "libs unchanged"; exit 0; fi
          git commit -m "build: libmezdu.so for ${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: keystore
        # a stable key keeps updates installable over the previous APK: secret ANDROID_KEYSTORE_B64 = base64 of a .jks
        # with alias androiddebugkey and password "android"
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > debug.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: throwaway key, the APK will not install over a previous one"
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: gradle
        run: |
          gradle --no-daemon assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/*.apk out/mezhdu.apk
          echo "${GITHUB_SHA::7} $(date -u +%FT%TZ)" > out/apk-version.txt
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mezhdu-apk
          path: out/mezhdu.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: APK (последняя сборка)
          make_latest: false
          files: |
            out/mezhdu.apk
            out/apk-version.txt
      - name: game library for code updates
        # code-<abi>.json last: a phone sees it only when the library it names is already there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          L=$(sed -n 's/^pub const LAUNCHER: u32 = \([0-9]*\);/\1/p' crates/launcher/src/lib.rs)
          mkdir -p code
          for abi in arm64-v8a x86_64; do
            so=app/src/main/jniLibs/$abi/libmezdu.so
            zstd -19 -q -f "$so" -o code/libmezdu-$abi.so.zst
            printf '{"build":"%s","sha256":"%s","size":%d,"zsize":%d,"launcher":%d}\n' "${GITHUB_SHA::7}" "$(sha256sum "$so" | cut -d' ' -f1)" "$(stat -c%s "$so")" "$(stat -c%s code/libmezdu-$abi.so.zst)" "$L" > code/code-$abi.json
          done
          cat code/*.json
          gh release upload app code/*.so.zst --clobber -R "$GITHUB_REPOSITORY"
          gh release upload app code/*.json --clobber -R "$GITHUB_REPOSITORY"
